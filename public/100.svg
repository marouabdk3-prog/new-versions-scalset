<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 100 100" xml:space="preserve">
  <defs>

    <!-- Silver brushed metal — alternating light/dark bands diagonal -->
    <linearGradient id="silverMetal" gradientUnits="userSpaceOnUse"
                    x1="20" y1="8" x2="80" y2="92">
      <stop offset="0%"   stop-color="#E8E8E8"/>
      <stop offset="8%"   stop-color="#9A9A9A"/>
      <stop offset="18%"  stop-color="#D4D4D4"/>
      <stop offset="28%"  stop-color="#2F3338"/>
      <stop offset="38%"  stop-color="#B8B8B8"/>
      <stop offset="48%"  stop-color="#E2E2E2"/>
      <stop offset="56%"  stop-color="#C0C0C0"/>
      <stop offset="65%"  stop-color="#3A3E44"/>
      <stop offset="74%"  stop-color="#C8C8C8"/>
      <stop offset="84%"  stop-color="#EBEBEB"/>
      <stop offset="92%"  stop-color="#A8A8A8"/>
      <stop offset="100%" stop-color="#D6D6D6"/>
    </linearGradient>

    <!-- Champagne edge — very subtle, only on contours -->
    <linearGradient id="champagneEdge" gradientUnits="userSpaceOnUse"
                    x1="10" y1="10" x2="90" y2="90">
      <stop offset="0%"   stop-color="#D6B36A" stop-opacity="0.70"/>
      <stop offset="20%"  stop-color="#EDD48A" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#C8A855" stop-opacity="0.20"/>
      <stop offset="60%"  stop-color="#D6B36A" stop-opacity="0.15"/>
      <stop offset="80%"  stop-color="#EDD48A" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#D6B36A" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Specular top-light — bright gloss streak -->
    <linearGradient id="specular" gradientUnits="userSpaceOnUse"
                    x1="50" y1="10" x2="50" y2="55">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Brushed metal micro-texture filter -->
    <filter id="brushed" x="-2%" y="-2%" width="104%" height="104%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.75 0.012"
                    numOctaves="3" seed="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="soft-light" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft glow for champagne edges -->
    <filter id="champGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── Layer 1 : depth shadow (dark offset) ── -->
  <path
    fill="#0f1114"
    opacity="0.55"
    transform="translate(0.4, 0.7)"
    d="M33.07,51.25L9.62,89.35L50,10.65l40.38,78.7L50,25.41L33.07,51.25z
       M46.35,50.43L50,46.57l40.38,42.78L66.36,56.63L50,33.99L33.64,56.63
       L9.62,89.35l31.54-33.42l22.04,17.05c0.69,0.54,1.42,1.03,2.17,1.48
       l25,14.89L46.35,50.43z
       M49.2,66.17l-6.71-5.57L9.62,89.35L35.4,74.17L49.2,66.17z
       M34.59,74.65L50,75.91l15.38-1.45L50,74.65H34.59z
       M34.59,74.65L50,78.71l15.38-4.25L50,77.45L34.59,74.65z
       M34.59,74.65L50,81.42l15.38-6.97L50,80.16L34.59,74.65z"/>

  <!-- ── Layer 2 : silver metallic base fill ── -->
  <path
    fill="url(#silverMetal)"
    d="M33.07,51.25L9.62,89.35L50,10.65l40.38,78.7L50,25.41L33.07,51.25z
       M46.35,50.43L50,46.57l40.38,42.78L66.36,56.63L50,33.99L33.64,56.63
       L9.62,89.35l31.54-33.42l22.04,17.05c0.69,0.54,1.42,1.03,2.17,1.48
       l25,14.89L46.35,50.43z
       M49.2,66.17l-6.71-5.57L9.62,89.35L35.4,74.17L49.2,66.17z
       M34.59,74.65L50,75.91l15.38-1.45L50,74.65H34.59z
       M34.59,74.65L50,78.71l15.38-4.25L50,77.45L34.59,74.65z
       M34.59,74.65L50,81.42l15.38-6.97L50,80.16L34.59,74.65z"/>

  <!-- ── Layer 3 : brushed metal texture overlay ── -->
  <path
    fill="url(#silverMetal)"
    filter="url(#brushed)"
    opacity="0.35"
    d="M33.07,51.25L9.62,89.35L50,10.65l40.38,78.7L50,25.41L33.07,51.25z
       M46.35,50.43L50,46.57l40.38,42.78L66.36,56.63L50,33.99L33.64,56.63
       L9.62,89.35l31.54-33.42l22.04,17.05c0.69,0.54,1.42,1.03,2.17,1.48
       l25,14.89L46.35,50.43z
       M49.2,66.17l-6.71-5.57L9.62,89.35L35.4,74.17L49.2,66.17z
       M34.59,74.65L50,75.91l15.38-1.45L50,74.65H34.59z
       M34.59,74.65L50,78.71l15.38-4.25L50,77.45L34.59,74.65z
       M34.59,74.65L50,81.42l15.38-6.97L50,80.16L34.59,74.65z"/>

  <!-- ── Layer 4 : champagne edge contours (stroke only) ── -->
  <path
    fill="none"
    stroke="url(#champagneEdge)"
    stroke-width="0.55"
    filter="url(#champGlow)"
    opacity="0.75"
    d="M33.07,51.25L9.62,89.35L50,10.65l40.38,78.7L50,25.41L33.07,51.25z
       M46.35,50.43L50,46.57l40.38,42.78L66.36,56.63L50,33.99L33.64,56.63
       L9.62,89.35l31.54-33.42l22.04,17.05c0.69,0.54,1.42,1.03,2.17,1.48
       l25,14.89L46.35,50.43z
       M49.2,66.17l-6.71-5.57L9.62,89.35L35.4,74.17L49.2,66.17z
       M34.59,74.65L50,75.91l15.38-1.45L50,74.65H34.59z
       M34.59,74.65L50,78.71l15.38-4.25L50,77.45L34.59,74.65z
       M34.59,74.65L50,81.42l15.38-6.97L50,80.16L34.59,74.65z"/>

  <!-- ── Layer 5 : top specular gloss streak ── -->
  <path
    fill="url(#specular)"
    d="M33.07,51.25L9.62,89.35L50,10.65l40.38,78.7L50,25.41L33.07,51.25z
       M46.35,50.43L50,46.57l40.38,42.78L66.36,56.63L50,33.99L33.64,56.63
       L9.62,89.35l31.54-33.42l22.04,17.05c0.69,0.54,1.42,1.03,2.17,1.48
       l25,14.89L46.35,50.43z
       M49.2,66.17l-6.71-5.57L9.62,89.35L35.4,74.17L49.2,66.17z
       M34.59,74.65L50,75.91l15.38-1.45L50,74.65H34.59z
       M34.59,74.65L50,78.71l15.38-4.25L50,77.45L34.59,74.65z
       M34.59,74.65L50,81.42l15.38-6.97L50,80.16L34.59,74.65z"/>

</svg>
